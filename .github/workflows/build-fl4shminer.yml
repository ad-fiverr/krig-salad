name: Build Fl4shMiner Salad image

on:
  push:
    branches:
      - main
    paths:
      - gpu-mining/runtime/fl4shminer/**
      - gpu-mining/telemetry/log_alerts/**
      - gpu-mining/telemetry/collector/g4a_salad_get.py
      - gpu-mining/telemetry/collector/fl4sh_early_autotune.py
      - gpu-mining/telemetry/collector/fl4shminer.py
      - gpu-mining/telemetry/collector/gpu_identity.py
      - gpu-mining/telemetry/collector/models.py
      - gpu-mining/telemetry/collector/startup_admission.py
      - gpu-mining/telemetry/collector/work.py
      - gpu-mining/g4c-live/live_secret_boundary.py
      - .github/workflows/build-fl4shminer.yml
      - .github/fl4sh-publish-targets.json
      - .github/scripts/fl4sh_publish.py
      - .github/scripts/test_fl4sh_publish.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-fl4shminer-salad-main
  cancel-in-progress: false

env:
  IMAGE: docker.io/myblockchaincompany/fl4shminer-salad
  VERSION: 1.5.2

jobs:
  build-test-publish:
    name: Build once, smoke-test, and publish six allowlisted targets
    if: github.repository == 'ad-fiverr/krig-salad'
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Prepare isolated runner paths
        run: |
          set -Eeuo pipefail
          {
            echo "DOCKER_CONFIG=$RUNNER_TEMP/fl4sh-build-auth"
            echo "BUILD_EVIDENCE=$RUNNER_TEMP/fl4sh-build-evidence.json"
            echo "PUBLISH_RESULTS=$RUNNER_TEMP/fl4sh-publish-results"
          } >> "$GITHUB_ENV"

      - name: Check runner disk space
        run: |
          set -Eeuo pipefail
          available_kib="$(df -Pk / | awk 'END {print $4}')"
          printf 'Available root filesystem: %s KiB\n' "$available_kib"
          (( available_kib >= 4194304 )) || {
            printf 'At least 4 GiB of free space is required for the CUDA build.\n' >&2
            exit 1
          }

      - name: Parse workflow YAML
        run: ruby -e 'require "yaml"; doc = YAML.load_file(ARGV.fetch(0)); abort "jobs missing" unless doc.is_a?(Hash) && doc["jobs"].is_a?(Hash)' .github/workflows/build-fl4shminer.yml

      - name: Validate fanout contract with offline fixtures
        run: python3 -B .github/scripts/test_fl4sh_publish.py

      - name: Run source smoke tests
        run: bash gpu-mining/runtime/fl4shminer/ci-smoke-test.sh --source

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Authenticate Docker Hub for pinned CUDA base pull
        if: github.ref == 'refs/heads/main'
        env:
          FANOUT_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          FANOUT_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 -B .github/scripts/fl4sh_publish.py base-login

      - name: Build local linux/amd64 image once from repository root
        run: |
          set -Eeuo pipefail
          local_build_args=(
            --platform linux/amd64
            --provenance=false
            --load
            --metadata-file "$RUNNER_TEMP/fl4sh-local-build.json"
            --build-arg "IMAGE_REVISION=$GITHUB_SHA"
            --file gpu-mining/runtime/fl4shminer/Dockerfile
            --tag fl4shminer-salad:ci
            .
          )
          docker buildx build "${local_build_args[@]}"
          python3 -B .github/scripts/fl4sh_publish.py capture --evidence "$BUILD_EVIDENCE"

      - name: End Docker Hub pull session before smoke test
        if: github.ref == 'refs/heads/main'
        run: python3 -B .github/scripts/fl4sh_publish.py base-logout

      - name: Smoke-test image without network or GPU
        run: |
          set -Eeuo pipefail
          image_id="$(python3 -B .github/scripts/fl4sh_publish.py image-id --evidence "$BUILD_EVIDENCE")"
          docker run --rm --network none --entrypoint /opt/fl4shminer/ci-smoke-test.sh "$image_id" --image
          python3 -B .github/scripts/fl4sh_publish.py seal --evidence "$BUILD_EVIDENCE"

      # Step-level bindings avoid dynamic secret names and keep each publisher
      # process from receiving another account's secret pair.
      - name: Publish primary
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          FANOUT_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          FANOUT_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 -B .github/scripts/fl4sh_publish.py publish --target primary --evidence "$BUILD_EVIDENCE" --results "$PUBLISH_RESULTS"

      - name: Publish loboeldrin
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          FANOUT_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_LOBOELDRIN }}
          FANOUT_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_LOBOELDRIN }}
        run: python3 -B .github/scripts/fl4sh_publish.py publish --target loboeldrin --evidence "$BUILD_EVIDENCE" --results "$PUBLISH_RESULTS"

      - name: Publish adrianfiverr
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          FANOUT_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_ADRIANFIVERR }}
          FANOUT_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_ADRIANFIVERR }}
        run: python3 -B .github/scripts/fl4sh_publish.py publish --target adrianfiverr --evidence "$BUILD_EVIDENCE" --results "$PUBLISH_RESULTS"

      - name: Publish naxter1234
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          FANOUT_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_NAXTER1234 }}
          FANOUT_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_NAXTER1234 }}
        run: python3 -B .github/scripts/fl4sh_publish.py publish --target naxter1234 --evidence "$BUILD_EVIDENCE" --results "$PUBLISH_RESULTS"

      - name: Publish ardevsolutions
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          FANOUT_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_ARDEVSOLUTIONS }}
          FANOUT_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_ARDEVSOLUTIONS }}
        run: python3 -B .github/scripts/fl4sh_publish.py publish --target ardevsolutions --evidence "$BUILD_EVIDENCE" --results "$PUBLISH_RESULTS"

      - name: Publish boeing787
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          FANOUT_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_BOEING787 }}
          FANOUT_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_BOEING787 }}
        run: python3 -B .github/scripts/fl4sh_publish.py publish --target boeing787 --evidence "$BUILD_EVIDENCE" --results "$PUBLISH_RESULTS"

      - name: Clear build authentication even on failure
        if: always() && github.ref == 'refs/heads/main'
        run: python3 -B .github/scripts/fl4sh_publish.py base-logout

      - name: Report all targets and require complete verified publication
        if: always() && github.ref == 'refs/heads/main'
        run: python3 -B .github/scripts/fl4sh_publish.py summary --evidence "$BUILD_EVIDENCE" --results "$PUBLISH_RESULTS"
